version: '3.8'
services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    image: dpg-db-local
    container_name: dpg-db
    restart: always
    ports:
      - '${DATABASE_PORT}:5432'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dpg-postgresdb:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432' ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dpg_internal
      - shared-net

  metabase:
    image: metabase/metabase:v0.56.1
    container_name: dpg-metabase
    restart: always
    ports:
      - '${METABASE_PORT:-3030}:3000'
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - dpg-metabase:/metabase-data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dpg_internal
      - shared-net

  redis:
    image: redis:7.2-alpine
    container_name: dpg-redis
    ports:
      - '${REDIS_PORT}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env
    restart: always
    command:
      - sh
      - -c
      - >
        exec redis-server --appendonly yes --appendfsync everysec --save "" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru} ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}

    volumes:
      - dpg-redis:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep PONG' ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dpg_internal
      - shared-net

  match-score:
    build:
      context: .
      dockerfile: apps/match-score/Dockerfile
    image: dpg-match-score-local
    container_name: dpg-match-score
    restart: always
    ports:
      - '${MATCH_SCORE_SERVICE_PORT:-5103}:5103'
    env_file:
      - .env
    environment:
      MATCH_SCORE_SERVICE_PORT: 5103
      BEDROCK_REGION: ${BEDROCK_REGION:-${AWS_REGION:-ap-south-1}}
    networks:
      - dpg_internal
      - shared-net
networks:
  dpg_internal:
    name: dpg_internal
    internal: false
  shared-net:
    name: shared-net
    internal: false
volumes:
  dpg-postgresdb:
    name: dpg-postgresdb
  dpg-metabase:
    name: dpg-metabase
  dpg-redis:
    name: dpg-redis
