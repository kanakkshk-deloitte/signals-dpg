services:
  db:
    build:
      context: ./docker/postgres
    image: dpg-db-postgis-pgvector:17
    container_name: dpg-db
    restart: always
    ports:
      - '${DATABASE_PORT}:5432'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dpg-postgresdb:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432' ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dpg_internal
      - shared-net

  metabase:
    image: metabase/metabase:v0.56.1
    container_name: dpg-metabase
    restart: always
    ports:
      - '${METABASE_PORT:-3030}:3000'
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - dpg-metabase:/metabase-data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dpg_internal
      - shared-net

  redis:
    image: redis:7.2-alpine
    container_name: dpg-redis
    ports:
      - '${REDIS_PORT}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env
    restart: always
    command:
      - sh
      - -c
      - >
        exec redis-server --appendonly yes --appendfsync everysec --save "" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru} ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}

    volumes:
      - dpg-redis:/data
    healthcheck:
      test: [ 'CMD-SHELL', 'redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep PONG' ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dpg_internal
      - shared-net

  match-score:
    build:
      context: .
      dockerfile: apps/match-score/Dockerfile
    image: dpg-match-score-local
    container_name: dpg-match-score
    restart: always
    ports:
      - '${MATCH_SCORE_SERVICE_PORT:-5103}:5103'
    env_file:
      - .env
    environment:
      MATCH_SCORE_SERVICE_PORT: 5103
      BEDROCK_REGION: ${BEDROCK_REGION:-${AWS_REGION:-ap-south-1}}
    networks:
      - dpg_internal
      - shared-net

  signals-bootstrap:
    build:
      context: .
      dockerfile: signals-bootstrap.Dockerfile
    image: signals-dpg/bootstrap:local
    container_name: signals-bootstrap
    command:
      - sh
      - -lc
      - |
        set -e
        # echo "signals-bootstrap: applying schema (drizzle-kit push --force)..."
        # pnpm --filter api exec drizzle-kit push --force
        # echo "signals-bootstrap: initialising extensions + item/action/event tables (db:init)..."
        pnpm --filter api db:init
        echo "signals-bootstrap: DONE."
    environment: &signals_env
      INSTANCE_NAME: ${INSTANCE_NAME:-signals-local}
      INSTANCE_ENV: development
      API_DOMAIN: ${API_DOMAIN:-http://localhost}
      API_PORT: "2742"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      INSTANCE_SHARED_SECRET: ${INSTANCE_SHARED_SECRET:?INSTANCE_SHARED_SECRET must be set in .env and be at least 32 chars}
      AUTH_MIDDLEWARE_ENABLED: ${AUTH_MIDDLEWARE_ENABLED:-true}
      CREATE_TEST_OTP: "true"
      VITE_NETWORK_ID: ${VITE_NETWORK_ID:-blue_dot}
      SERVED_DOMAINS: ${SERVED_DOMAINS:-blue_dot/seeker,blue_dot/provider}
      NETWORK_CONFIG_SOURCE: local
      NETWORK_CONFIG_LOCAL_FILE: examples/schemas/${VITE_NETWORK_ID:-blue_dot}/network.json
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgresdb}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_PORT: "5432"
      POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgresdb}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SIGNALS_PII_KEY: ${SIGNALS_PII_KEY:?SIGNALS_PII_KEY must be a base64-encoded 32-byte key}
      SIGNALS_SEARCH_URL: ${SIGNALS_SEARCH_URL:-}
      SIGNALS_SEARCH_API_KEY: ${SIGNALS_SEARCH_API_KEY:-}
      SIGNALS_SEARCH_DISTANCE_METERS: ${SIGNALS_SEARCH_DISTANCE_METERS:-30000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - dpg_internal
      - shared-net

  signals-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: signals-dpg/api:local
    container_name: signals-api
    restart: always
    environment: *signals_env
    ports:
      - '${API_PORT:-2742}:2742'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      signals-bootstrap:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dpg_internal
      - shared-net

  signals-ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        VITE_API_URL: https://bluedot.dpxdemo.com/signals-api
        VITE_NETWORK_NAME: ${VITE_NETWORK_ID:-blue_dot}
    image: signals-dpg/ui:local
    container_name: signals-ui
    restart: always
    environment:
      UI_VARIANT: signals
      VITE_NETWORK_ID: ${VITE_NETWORK_ID:-blue_dot}
      VITE_NETWORK_NAME: ${VITE_NETWORK_ID:-blue_dot}
    ports:
      - '5173:80'
    depends_on:
      signals-api:
        condition: service_started
    networks:
      - dpg_internal
      - shared-net
networks:
  dpg_internal:
    name: dpg_internal
    internal: false
  shared-net:
    external: true
    name: dpg_share
volumes:
  dpg-postgresdb:
    name: dpg-postgresdb
  dpg-metabase:
    name: dpg-metabase
  dpg-redis:
    name: dpg-redis
